<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KeeRust</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: system-ui, -apple-system, sans-serif;
        background: #0f1117;
        color: #e2e8f0;
        height: 100vh;
        overflow: hidden;
      }

      /* ── Shared screen wrapper ─────────────────────────────── */
      .screen { display: none; }
      .screen.active { display: flex; }

      /* ── Auth screens (config / unlock) ─────────────────────── */
      #screen-config,
      #screen-unlock {
        align-items: center;
        justify-content: center;
        height: 100vh;
      }

      .auth-box { width: 100%; max-width: 420px; padding: 0 1.5rem; }

      .logo { text-align: center; margin-bottom: 2rem; }
      .logo h1 { font-size: 2rem; font-weight: 700; color: #fff; letter-spacing: -0.5px; }
      .logo p  { color: #64748b; font-size: 0.9rem; margin-top: 0.25rem; }

      h2 {
        font-size: 1.1rem; font-weight: 600; color: #94a3b8;
        margin-bottom: 1.5rem; text-align: center;
        text-transform: uppercase; letter-spacing: 0.05em;
      }

      .form-group { margin-bottom: 1rem; }
      label {
        display: block; font-size: 0.8rem; font-weight: 500;
        color: #94a3b8; margin-bottom: 0.35rem;
        text-transform: uppercase; letter-spacing: 0.04em;
      }
      input[type="url"],
      input[type="text"],
      input[type="password"],
      input[type="search"] {
        width: 100%; padding: 0.65rem 0.9rem;
        background: #1e2433; border: 1px solid #2d3748;
        border-radius: 8px; color: #e2e8f0; font-size: 0.95rem;
        outline: none; transition: border-color 0.15s;
      }
      input:focus { border-color: #4a90e2; }
      input::placeholder { color: #4a5568; }

      .btn {
        width: 100%; padding: 0.75rem; background: #4a90e2;
        border: none; border-radius: 8px; color: #fff;
        font-size: 1rem; font-weight: 600; cursor: pointer;
        margin-top: 1.5rem; transition: background 0.15s, opacity 0.15s;
      }
      .btn:hover:not(:disabled) { background: #357abd; }
      .btn:disabled { opacity: 0.5; cursor: not-allowed; }

      .link-btn {
        display: block; width: 100%; margin-top: 1rem;
        background: none; border: none; color: #4a90e2;
        font-size: 0.875rem; cursor: pointer; text-align: center; padding: 0.4rem;
      }
      .link-btn:hover { color: #7ab4f0; }

      .vault-source {
        text-align: center; font-size: 0.8rem; color: #4a5568;
        margin-bottom: 1.5rem; word-break: break-all;
      }

      .error {
        background: #3b1f1f; border: 1px solid #6b2d2d; color: #fc8181;
        border-radius: 8px; padding: 0.65rem 0.9rem; font-size: 0.875rem;
        margin-top: 1rem; display: none;
      }
      .error.visible { display: block; }

      /* ── Vault layout ────────────────────────────────────────── */
      #screen-vault {
        display: none;
        grid-template-areas:
          "header header header"
          "sidebar entries detail";
        grid-template-columns: 210px 340px 1fr;
        grid-template-rows: 48px 1fr;
        height: 100vh;
      }
      #screen-vault.active { display: grid; }

      /* Header */
      .vault-header {
        grid-area: header;
        display: flex; align-items: center; gap: 0.75rem;
        padding: 0 1rem;
        background: #161b27;
        border-bottom: 1px solid #1e2a3a;
        z-index: 10;
      }
      .vault-brand {
        font-size: 1rem; font-weight: 700; color: #fff;
        white-space: nowrap; margin-right: 0.5rem;
      }
      .vault-search-wrap { flex: 1; }
      .vault-search-wrap input {
        background: #1e2433; border: 1px solid #2d3748;
        border-radius: 6px; padding: 0.4rem 0.8rem;
        color: #e2e8f0; font-size: 0.875rem; width: 100%;
      }
      .btn-lock {
        padding: 0.35rem 0.9rem; background: none;
        border: 1px solid #2d3748; border-radius: 6px;
        color: #94a3b8; font-size: 0.8rem; cursor: pointer;
        white-space: nowrap; transition: border-color 0.15s, color 0.15s;
      }
      .btn-lock:hover { border-color: #4a90e2; color: #4a90e2; }

      /* Sidebar */
      .vault-sidebar {
        grid-area: sidebar;
        background: #13181f;
        border-right: 1px solid #1e2a3a;
        overflow-y: auto; padding: 0.5rem 0;
      }
      .sidebar-section {
        padding: 0.5rem 0.75rem 0.25rem;
        font-size: 0.7rem; font-weight: 600;
        text-transform: uppercase; letter-spacing: 0.08em;
        color: #4a5568;
      }
      .group-item {
        display: flex; align-items: center; justify-content: space-between;
        padding: 0.45rem 0.75rem; cursor: pointer;
        border-radius: 6px; margin: 0 0.35rem;
        font-size: 0.875rem; color: #94a3b8;
        transition: background 0.1s, color 0.1s;
        user-select: none;
      }
      .group-item:hover { background: #1e2433; color: #e2e8f0; }
      .group-item.active { background: #1e3a5f; color: #60a5fa; }
      .group-item .group-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .group-count {
        font-size: 0.7rem; background: #1e2433;
        border-radius: 10px; padding: 0.1rem 0.45rem;
        color: #64748b; min-width: 24px; text-align: center;
      }
      .group-item.active .group-count { background: #1e3a5f; color: #93c5fd; }

      /* Entry list */
      .vault-entries {
        grid-area: entries;
        overflow-y: auto;
        border-right: 1px solid #1e2a3a;
      }
      .entry-item {
        display: flex; align-items: center; gap: 0.75rem;
        padding: 0.65rem 0.85rem; cursor: pointer;
        border-bottom: 1px solid #1a2032;
        transition: background 0.1s;
        user-select: none;
      }
      .entry-item:hover { background: #1a2233; }
      .entry-item.active { background: #1e3a5f; }
      .entry-avatar {
        width: 34px; height: 34px; border-radius: 8px;
        display: flex; align-items: center; justify-content: center;
        font-size: 0.9rem; font-weight: 700; flex-shrink: 0;
        color: #fff;
      }
      .entry-info { flex: 1; min-width: 0; }
      .entry-title {
        font-size: 0.875rem; font-weight: 600; color: #e2e8f0;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .entry-sub {
        font-size: 0.75rem; color: #64748b; margin-top: 0.1rem;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .entry-empty {
        padding: 3rem 1.5rem; text-align: center;
        color: #4a5568; font-size: 0.875rem;
      }

      /* Detail panel */
      .vault-detail {
        grid-area: detail;
        overflow-y: auto;
        padding: 1.5rem;
        background: #0f1117;
      }
      .detail-empty {
        height: 100%; display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        color: #2d3748; font-size: 0.875rem; gap: 0.5rem;
      }
      .detail-empty svg { opacity: 0.3; }
      .detail-title {
        font-size: 1.25rem; font-weight: 700; color: #fff;
        margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.75rem;
      }
      .detail-avatar {
        width: 40px; height: 40px; border-radius: 10px;
        display: flex; align-items: center; justify-content: center;
        font-size: 1.1rem; font-weight: 700; color: #fff; flex-shrink: 0;
      }
      .detail-field { margin-bottom: 1.25rem; }
      .detail-label {
        font-size: 0.7rem; font-weight: 600; text-transform: uppercase;
        letter-spacing: 0.07em; color: #4a5568; margin-bottom: 0.4rem;
      }
      .detail-value {
        display: flex; align-items: center; gap: 0.5rem;
        background: #1e2433; border: 1px solid #2d3748;
        border-radius: 8px; padding: 0.55rem 0.75rem;
      }
      .detail-value span {
        flex: 1; font-size: 0.875rem; color: #e2e8f0;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        word-break: break-all; white-space: pre-wrap;
        font-family: ui-monospace, 'Cascadia Code', monospace;
      }
      .detail-value span.masked { letter-spacing: 0.2em; color: #64748b; font-size: 0.75rem; }
      .icon-btn {
        flex-shrink: 0; padding: 0.25rem 0.55rem;
        background: #2d3748; border: none; border-radius: 5px;
        color: #94a3b8; font-size: 0.75rem; cursor: pointer;
        transition: background 0.15s, color 0.15s;
      }
      .icon-btn:hover { background: #374151; color: #e2e8f0; }
      .detail-notes {
        background: #1e2433; border: 1px solid #2d3748;
        border-radius: 8px; padding: 0.65rem 0.75rem;
        font-size: 0.875rem; color: #94a3b8; white-space: pre-wrap;
        word-break: break-word; line-height: 1.5;
        font-family: ui-monospace, 'Cascadia Code', monospace;
        max-height: 150px; overflow-y: auto;
      }
      .detail-group-tag {
        display: inline-flex; align-items: center; gap: 0.35rem;
        background: #1e2433; border: 1px solid #2d3748;
        border-radius: 20px; padding: 0.25rem 0.65rem;
        font-size: 0.75rem; color: #64748b;
      }
      .copied-toast {
        position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
        background: #1e3a5f; color: #93c5fd; border: 1px solid #2563eb;
        border-radius: 8px; padding: 0.5rem 1.25rem; font-size: 0.875rem;
        pointer-events: none; opacity: 0; transition: opacity 0.2s;
        z-index: 100;
      }
      .copied-toast.show { opacity: 1; }
    </style>
  </head>
  <body>

    <!-- ── Config Screen ───────────────────────────────────── -->
    <div id="screen-config" class="screen">
      <div class="auth-box">
        <div class="logo">
          <h1>KeeRust</h1>
          <p>KeePass via WebDAV</p>
        </div>
        <h2>WebDAV Setup</h2>
        <form id="form-config" novalidate>
          <div class="form-group">
            <label for="dav-url">WebDAV URL</label>
            <input type="url" id="dav-url"
              placeholder="https://cloud.example.com/vault.kdbx"
              pattern="^https://.+" required />
          </div>
          <div class="form-group">
            <label for="dav-user">Username</label>
            <input type="text" id="dav-user" autocomplete="username" required />
          </div>
          <div class="form-group">
            <label for="dav-pass">Password</label>
            <input type="password" id="dav-pass" autocomplete="current-password" required />
          </div>
          <div id="config-error" class="error"></div>
          <button type="submit" class="btn">Save & Continue</button>
        </form>
      </div>
    </div>

    <!-- ── Unlock Screen ───────────────────────────────────── -->
    <div id="screen-unlock" class="screen">
      <div class="auth-box">
        <div class="logo">
          <h1>KeeRust</h1>
          <p>Enter your master password</p>
        </div>
        <div id="vault-source" class="vault-source"></div>
        <form id="form-unlock" novalidate>
          <div class="form-group">
            <label for="master-pass">Master Password</label>
            <input type="password" id="master-pass" autocomplete="current-password" required />
          </div>
          <div id="unlock-error" class="error"></div>
          <button type="submit" class="btn" id="btn-unlock">Unlock</button>
        </form>
        <button id="btn-change-config" class="link-btn">Change WebDAV settings</button>
      </div>
    </div>

    <!-- ── Vault Screen ────────────────────────────────────── -->
    <div id="screen-vault" class="screen">

      <header class="vault-header">
        <span class="vault-brand">KeeRust</span>
        <div class="vault-search-wrap">
          <input type="search" id="search-input" placeholder="Search entries…" />
        </div>
        <button class="btn-lock" id="btn-lock">🔒 Lock</button>
      </header>

      <nav class="vault-sidebar" id="group-list"></nav>

      <div class="vault-entries" id="entry-list"></div>

      <div class="vault-detail" id="entry-detail">
        <div class="detail-empty">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <span>Select an entry to view details</span>
        </div>
      </div>

    </div>

    <!-- Toast -->
    <div class="copied-toast" id="toast"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
