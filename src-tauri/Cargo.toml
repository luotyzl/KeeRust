[package]
name = "keerust"
version = "0.1.0"
edition = "2021"

[lib]
name = "keerust_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
keepass = { git = "https://github.com/sseemayer/keepass-rs", features = ["save_kdbx4"] }
uuid = "1"
secrecy = "0.10"
chrono = "0.4"
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
image = { version = "0.25", default-features = false, features = ["png", "ico", "jpeg", "gif", "webp"] }
