[package]
name = "keerust"
version = "0.1.0"
edition = "2021"

[lib]
name = "keerust_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
enigo = "0.3"
arboard = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
keepass = { git = "https://github.com/sseemayer/keepass-rs", features = ["save_kdbx4", "_merge"] }
uuid = "1"
secrecy = "0.10"
chrono = "0.4"
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
image = { version = "0.25", default-features = false, features = ["png", "ico", "jpeg", "gif", "webp"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_System_RemoteDesktop",
] }

# Opening/saving a KDBX runs Argon2 — a deliberately memory-hard KDF that is
# 10-50x slower when compiled unoptimized. `tauri dev` uses the dev profile, so
# without this the crypto crates run at opt-level 0 and unlocking takes seconds.
# Optimize all dependencies (argon2, aes, sha2, …) while keeping our own crate
# at opt-level 0 for fast, debuggable incremental builds.
[profile.dev.package."*"]
opt-level = 3

# Squeeze a bit more crypto throughput out of release builds.
[profile.release]
lto = "thin"
codegen-units = 1
